name: Bug report
description: Something broke or behaved unexpectedly
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Mettle version
      placeholder: "0.9.2"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS + version
      placeholder: "macOS 14.5 / Ubuntu 22.04"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open Mettle
        2. Click Analyze on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Console.app entries filtered by "mettle", terminal output, or browser dev tools console.
      render: shell
