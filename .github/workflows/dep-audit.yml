name: Dependency Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"  # daily 06:00 UTC

jobs:
  python:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pip-audit
      - name: Audit
        run: pip-audit --vulnerability-service osv .

  rust:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pulls the prebuilt binary from the rustsec/rustsec GitHub Releases
      # instead of building it. `cargo install cargo-audit --locked` compiled
      # the tool and ~110 dependencies from source on every run, which was
      # ~3min of this job's ~3m10s wall time — for a job that runs on every
      # PR and daily on a schedule.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit
        working-directory: web/frontend/src-tauri
        # Ignore unmaintained-crate advisories (RUSTSEC informational warnings).
        # GTK3 deps come in via Tauri's optional Linux backend; we don't ship
        # Linux builds. Real vulnerabilities still block.
        run: cargo audit --ignore RUSTSEC-2024-0411 --ignore RUSTSEC-2024-0412 --ignore RUSTSEC-2024-0413 --ignore RUSTSEC-2024-0414 --ignore RUSTSEC-2024-0415 --ignore RUSTSEC-2024-0416 --ignore RUSTSEC-2024-0417 --ignore RUSTSEC-2024-0418 --ignore RUSTSEC-2024-0420

  javascript:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install
        working-directory: web/frontend
        run: npm ci
      - name: Audit (high+critical only)
        working-directory: web/frontend
        run: npm audit --omit=dev --audit-level=high
