version: 2
updates:
  # Python deps.
  #
  # Version updates are disabled (limit 0); security updates still open PRs —
  # they are exempt from this limit. Mettle is published to PyPI and declares
  # open-ended floors (`rich>=13.7.0`, `sqlalchemy>=2.0.25`, ...), which is the
  # right contract for a library: take whatever recent version the user's
  # environment resolves. Dependabot's pip version updates only ever raise
  # those floors, which narrows what Mettle can be installed alongside without
  # buying anything — we don't need the newer APIs, and users already get the
  # latest resolvable version. Left on, it regenerates the same PRs forever.
  #
  # A real vulnerability still needs the floor raised, and that arrives as a
  # security update, which this does not suppress. If Mettle ever pins or
  # ships a lockfile, revisit.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
      - "python"
    open-pull-requests-limit: 0

  # Rust deps (Tauri shell)
  - package-ecosystem: "cargo"
    directory: "/web/frontend/src-tauri"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
      - "rust"
    open-pull-requests-limit: 5
    # Tauri's GTK3 backend is Linux-only and pins this family at 0.18.x.
    # We ship aarch64-apple-darwin exclusively, and `cargo tree -i <crate>
    # --target aarch64-apple-darwin` reports "nothing to print" for every
    # entry below — none of it is compiled into the shipped app. Advisories
    # here are unfixable without Tauri moving off GTK3, so Dependabot could
    # only retry `security_update_not_possible` daily and fail the run.
    # cargo-audit already allowlists the matching RUSTSEC ids in
    # .github/workflows/dep-audit.yml. Revisit if a Linux target is added.
    ignore:
      - dependency-name: "glib"
      - dependency-name: "glib-sys"
      - dependency-name: "glib-macros"
      - dependency-name: "gtk"
      - dependency-name: "gtk-sys"
      - dependency-name: "gtk3-macros"
      - dependency-name: "gdk"
      - dependency-name: "gdk-sys"
      - dependency-name: "gdkx11"
      - dependency-name: "gdk-pixbuf"
      - dependency-name: "gdk-pixbuf-sys"
      - dependency-name: "gio"
      - dependency-name: "gio-sys"
      - dependency-name: "gobject-sys"
      - dependency-name: "atk"
      - dependency-name: "atk-sys"
      - dependency-name: "pango"
      - dependency-name: "pango-sys"
      - dependency-name: "cairo-rs"
      - dependency-name: "cairo-sys-rs"
      - dependency-name: "soup3"
      - dependency-name: "soup3-sys"
      - dependency-name: "javascriptcore-rs"
      - dependency-name: "javascriptcore-rs-sys"
      - dependency-name: "webkit2gtk"
      - dependency-name: "webkit2gtk-sys"

  # npm deps (Vue frontend)
  - package-ecosystem: "npm"
    directory: "/web/frontend"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
      - "javascript"
    open-pull-requests-limit: 5
    versioning-strategy: "increase-if-necessary"

  # GitHub Actions versions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
