[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mettle"
version = "0.9.1"
description = "A triage dashboard for the AI-coding era. Honest line counts, health scoring, and cross-project insight for solo developers managing repo sprawl."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Greg Herriott" }]
keywords = [
    "code-analysis",
    "loc",
    "lines-of-code",
    "metrics",
    "code-quality",
    "triage",
    "dashboard",
    "developer-tools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "rich>=13.7.0",
    "reportlab>=4.0.8",
    "matplotlib>=3.8.2",
    "questionary>=2.0.1",
    "pyyaml>=6.0.1",
    "click>=8.1.7",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.27.0",
    "sqlmodel>=0.0.16",
    "sqlalchemy>=2.0.25",
    "websockets>=12.0",
    "aiosqlite>=0.19.0",
    "python-multipart>=0.0.18",
    "alembic>=1.13.0",
]

watch = [
    "watchfiles>=0.21",
]

dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "httpx>=0.27",  # required by starlette.TestClient for the security test suite
]

[project.scripts]
mettle = "mettle.cli:cli"

[project.urls]
Homepage = "https://github.com/mudislandkid/mettle"
Documentation = "https://mudislandkid.github.io/mettle/"
Issues = "https://github.com/mudislandkid/mettle/issues"

[tool.setuptools]
packages = ["mettle", "mettle.analyzers", "mettle.metrics", "mettle.reporters", "mettle.tests"]
py-modules = ["batch_analyze"]

[tool.setuptools.package-data]
mettle = ["config.yaml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # FastAPI Depends() in default args is idiomatic; not a real issue
]

[tool.ruff.lint.per-file-ignores]
# web backend files that do sys.path surgery before importing project modules
"web/backend/services/analyzer_service.py" = ["E402"]
"web/backend/api/routes_export.py" = ["E402"]
# alembic + sqlmodel imports cause oscillating isort behavior; suppress I001
"web/backend/database/connection.py" = ["I001"]

[tool.pytest.ini_options]
testpaths = ["mettle/tests", "web/backend/tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.bandit]
# Skip test directories entirely. They contain example secrets, literal
# 0.0.0.0 strings (testing the bind-safety guard), and asserts — all
# false positives for SAST against application code.
exclude_dirs = ["mettle/tests", "web/backend/tests"]
